spring.application.name=DevFlow

#Para ejejutarlo desde otra pc
server.address=0.0.0.0


# Configuraci\u00f3n de la base de datos MySQL

#---Local-------------------------------------------------
spring.datasource.url=jdbc:mysql://localhost:3306/devflow
spring.datasource.username=root
spring.datasource.password=

#---Externa-----------------------------------------------
#spring.datasource.url=jdbc:mysql://192.168.0.63/devflow
#spring.datasource.username=guido
#spring.datasource.password=Contrase\u00f1aSegura

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuraci\u00f3n de JPA e Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Configuraci\u00f3n de la zona horaria (opcional)
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.maximum-pool-size=10
spring.jpa.properties.hibernate.jdbc.time_zone=UTC


