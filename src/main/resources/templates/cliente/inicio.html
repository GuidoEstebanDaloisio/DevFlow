<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <title>Inicio - DevFlow</title>
        <link rel="stylesheet" href="css/estilos.css">
    </head>
    <body>
        <!-- Encabezado -->
        <header class="header">
            <h2 class="logo">DevFlow</h2>
            <div class="user-info">
                <span>Cliente: <span th:text="${usuario.nombre}">Nombre</span></span>
                <button class="logout-btn" onclick="window.location.href = '/login'">Cerrar Sesión</button>
            </div>
        </header>

        <!-- Contenedor principal -->
        <div class="main-container">
            <!-- Barra lateral -->
            <nav class="sidebar">
                <ul>
                    <li>🏠 <a href="/cliente">Inicio</a></li>
                    <li>📁 <a href="/cliente/proyectos">Mis Proyectos</a></li>
                </ul>
            </nav>

            <!-- Contenido principal -->
            <main class="content">
                <section class="user-card">
                    <p><strong>Nombre:</strong> <span th:text="${usuario.nombre}">user_name</span></p>
                    <p><strong>Email:</strong> <span th:text="${usuario.email}">user_email</span></p>
                    <p><strong>Teléfono:</strong> <span th:text="${usuario.telefono}">user_tel</span></p>
                    <p><strong>Rol:</strong> <span th:text="${usuario.rol}">user_rol</span></p>
                </section>            <section class="summary-cards">
                    <div class="card pink">Proyectos en revisión: <span th:text="${CantProyectosEnRevision}">0</span></div>
                    <div class="card green">Proyectos aprobados: <span th:text="${CantProyectosAprobados}">0</span></div>
                    <div class="card red">Proyectos rechazados: <span th:text="${CantProyectosRechazados}">0</span></div>
                    <div class="card blue">Proyectos en curso: <span th:text="${CantProyectosEnProceso}">0</span></div>
                    <div class="card purple">Proyectos completados: <span th:text="${CantProyectosFinalizados}">0</span></div>
                    <div class="card gray">Proyectos cancelados: <span th:text="${CantProyectosCancelados}">0</span></div>
                    <div class="card orange">Proyectos en pausa: <span th:text="${CantProyectosEnPausa}">0</span></div>
                </section>
            </main>
        </div>
    </body>
</html>
