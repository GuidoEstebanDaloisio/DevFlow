<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Solicitar nuevo proyecto</title>
</head>
<body>
    <h2>📝 Solicitar un nuevo proyecto</h2>

    <form method="POST" action="/cliente/proyectos/nuevo">
        <label>Título del Proyecto:<br>
            <input type="text" name="titulo" th:value="${titulo}" required>
        </label><br><br>

        <label>Descripción:<br>
            <textarea name="descripcion" rows="4" cols="50" th:text="${descripcion}" required></textarea>
        </label><br><br>

        <label>Medio de Encargo:<br>
            <input type="text" name="medio_encargo" th:value="${medio_encargo}" placeholder="Ej: Correo, WhatsApp, etc." required>
        </label><br><br>

        <label>Presupuesto estimado (en ARS):<br>
            <input type="number" name="presupuesto" step="any" th:value="${presupuesto}" required>
        </label><br><br>

        <div th:if="${error}" style="color: red;">
            <p th:text="${error}"></p>
        </div>

        <button type="submit">Enviar solicitud</button>
        <a href="/cliente/proyectos"><button type="button">Cancelar</button></a>
    </form>
</body>
</html>
