<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <title>Detalle del Proyecto</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="/css/estilos.css">
        <link rel="stylesheet" href="/css/botones.css">
        <script src="/js/usuario-logueado.js"></script>
        <script src="/js/alertas.js"></script>
    </head>
    <body>

        <!-- Encabezado -->
        <header class="header">
            <h2 class="logo">DevFlow</h2>
            <div class="user-info">
                <div class="user-dropdown">
                    <div class="user-avatar" onclick="toggleDropdown()">
                        <img src="/img/usuario-cliente.png" alt="Avatar" class="avatar-img">
                        <span th:text="${nombreUsuario}">Nombre</span>
                        <span class="arrow">▼</span>
                    </div>
                    <div class="dropdown-menu" id="userMenu">
                        <a href="/cliente">Perfil</a>
                        <a href="/login">Cerrar sesión</a>
                    </div>
                </div>
            </div>
        </header>

        <!-- Contenedor principal -->
        <div class="main-container">
            <!-- Barra lateral -->
            <nav class="sidebar">
                <ul>
                    <li>🟣 <a href="/cliente">Inicio</a></li>
                    <li>🟣 <a href="/cliente/proyectos">Mis Proyectos</a></li>
                </ul>
            </nav>

            <!-- Contenido principal -->
            <main class="content">

                <section class="user-card">
                    <p><strong>ID:</strong> <span th:text="${proyecto.id}"></span></p>
                    <p><strong>Título:</strong> <span th:text="${proyecto.titulo}"></span></p>
                    <p><strong>Descripción:</strong> <span th:text="${proyecto.descripcion}"></span></p>
                    <p><strong>Medio de Encargo:</strong> <span th:text="${proyecto.medioEncargo}"></span></p>
                    <p><strong>Presupuesto:</strong> $<span th:text="${proyecto.presupuesto}"></span></p>
                    <p><strong>Estado de Avance:</strong> <span th:text="${proyecto.estadoAvance}"></span></p>
                    <p><strong>Fecha de Inicio:</strong>
                        <span th:text="${proyecto.fechaInicio != null} ? ${#dates.format(proyecto.fechaInicio, 'yyyy-MM-dd')} : ''"></span>
                    </p>
                    <p><strong>Fecha de Finalización:</strong>
                        <span th:text="${proyecto.fechaFinalizacion != null} ? ${#dates.format(proyecto.fechaFinalizacion, 'yyyy-MM-dd')} : ''"></span>
                    </p>
                </section>

                <div class="btn-generico">
                    <a href="/cliente/proyectos">
                        <button type="button">Volver a Proyectos</button>
                    </a>
                </div>

                <div th:if="${proyecto.estadoAvance.name() == 'EN_PROGRESO' or proyecto.estadoAvance.name() == 'EN_PAUSA'}">


                    <div class="asignacion-container">
                        <div class="user-card tabla-asignados">
                            <!-- Tabla de desarrolladores del proyecto -->
                            <h2>Desarrolladores Asignados</h2>
                            <table class="user-table">
                                <thead>
                                    <tr>
                                        <th>ID</th>
                                        <th>Nombre</th>
                                        <th>Habilidades</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:each="devAsig : ${desarrolladoresAsignados}">
                                        <td th:text="${devAsig.id}"></td>
                                        <td th:text="${devAsig.nombre}"></td>
                                        <td th:text="${devAsig.habilidades}"></td>                                        
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </body>
</html>
