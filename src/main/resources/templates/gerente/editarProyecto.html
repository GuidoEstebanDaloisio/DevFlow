<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <title>Editar Proyecto</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="/css/estilos.css">
        <link rel="stylesheet" href="/css/formularios.css">
        <script src="/js/usuario-logueado.js"></script>
        <script src="/js/alertas.js"></script>
    </head>
    <body>

        <!-- Encabezado -->
        <header class="header">
            <h2 class="logo">DevFlow</h2>
            <div class="user-info">
                <div class="user-dropdown">
                    <div class="user-avatar" onclick="toggleDropdown()">
                        <img src="/img/usuario-gerente.png" alt="Avatar" class="avatar-img">
                        <span th:text="${nombreUsuario}">Nombre</span>
                        <span class="arrow">▼</span>
                    </div>
                    <div class="dropdown-menu" id="userMenu">
                        <a href="/gerente">Perfil</a>
                        <a href="/login">Cerrar sesión</a>
                    </div>
                </div>
            </div>
        </header>

        <div class="main-container">
            <nav class="sidebar">
                <ul>
                    <li>🟣 <a href="/gerente">Inicio</a></li>
                    <li>🟣 <a href="/gerente/clientes">Clientes</a></li>
                    <li>🟣 <a href="/gerente/proyectos">Proyectos</a></li>
                </ul>
            </nav>

            <div class="content">
                <h2 class="form-title">Editar Proyecto</h2>

                <form method="POST" th:action="@{'/gerente/proyectos/editar/' + ${proyecto.id}}" th:object="${proyecto}" class="form-container">
                    <label class="form-label" for="titulo">Título:</label>
                    <input type="text" id="titulo" name="titulo" th:value="*{titulo}" required class="form-input">


                    <label class="form-label" for="descripcion">Descripción:</label>
                    <textarea type="text" id="descripcion" name="descripcion" th:field="*{descripcion}" required rows="4" cols="50" class="form-input"></textarea>

                    <label class="form-label" for="medioEncargo">Medio de Encargo:</label>
                    <input type="text" id="medioEncargo" name="medioEncargo" th:value="*{medioEncargo}" required class="form-input">

                    <label class="form-label">Presupuesto:</label>
                    <input type="number" name="presupuesto" th:value="*{presupuesto}" required class="form-input" step="0.1">

                    <div th:if="${error}" class="error-message">
                        <p th:text="${error}"></p>
                    </div>

                    <div class="form-actions">
                        <button type="submit" class="form-button">Guardar</button>
                        <a href="/gerente/proyectos"><button type="button" class="form-button cancel-button">Cancelar</button></a>
                    </div>
                </form>
            </div>
        </div>





















    </body>
</html>
