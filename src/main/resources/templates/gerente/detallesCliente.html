<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <title>Detalle del Proyecto</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="/css/estilos.css">
        <script src="/js/usuario-logueado.js"></script>
        <script src="/js/alertas.js"></script>
    </head>
    <body>

        <!-- Encabezado -->
        <header class="header">
            <h2 class="logo">DevFlow</h2>
            <div class="user-info">
                <div class="user-dropdown">
                    <div class="user-avatar" onclick="toggleDropdown()">
                        <img src="/img/usuario-gerente.png" alt="Avatar" class="avatar-img">
                        <span th:text="${usuario.nombre}">Nombre</span>
                        <span class="arrow">▼</span>
                    </div>
                    <div class="dropdown-menu" id="userMenu">
                        <a href="/gerente">Perfil</a>
                        <a href="/login">Cerrar sesión</a>
                    </div>
                </div>
            </div>
        </header>

        <!-- Contenedor principal -->
        <div class="main-container">
            <!-- Barra lateral -->
            <nav class="sidebar">
                <ul>
                    <li>🏠 <a href="/gerente">Inicio</a></li>
                    <li>👥 <a href="/gerente/clientes">Clientes</a></li>
                    <li>📁 <a href="/gerente/proyectos">Proyectos</a></li>
                </ul>
            </nav>

            <!-- Contenido principal -->
            <main class="content">
                <section class="user-card">
                    <p><strong>ID:</strong> <span th:text="${usuario.id}">user_name</span></p>
                    <p><strong>Nombre:</strong> <span th:text="${usuario.nombre}">user_name</span></p>
                    <p><strong>Email:</strong> <span th:text="${usuario.email}">user_email</span></p>
                    <p><strong>Teléfono:</strong> <span th:text="${usuario.telefono}">user_tel</span></p>
                </section>
                <div class="new-element-btn">

                    <a href="/gerente/clientes">
                        <button type="button">Volver a Clientes</button>
                    </a>
                </div>
                <!-- Tabla de proyectos -->
                <div class="user-card">
                    <table class="user-table">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Título</th>
                                <th>Estado de avance</th>
                                <th>Fecha de inicio</th>
                                <th>Fecha de finalización</th>
                                <th>Presupuesto</th>
                                <th>Medio de encargo</th>
                                <th>Acción</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="proyecto : ${proyectosSolicitados}">
                                <td th:text="${proyecto.id}"></td>
                                <td th:text="${proyecto.titulo}"></td>
                                <td th:text="${proyecto.estadoAvance}"></td>
                                <td th:text="${proyecto.fechaInicio != null ? #dates.format(proyecto.fechaInicio, 'dd/MM/yyyy') : '--'}"></td>
                                <td th:text="${proyecto.fechaFinalizacion != null ? #dates.format(proyecto.fechaFinalizacion, 'dd/MM/yyyy') : '--'}"></td>
                                <td th:text="${'$ %.2f'.formatted(proyecto.presupuesto)}"></td>
                                <td th:text="${proyecto.medioEncargo}"></td>
                                <td class="actions">
                                    <a th:href="@{'/gerente/proyectos/detalles/' + ${proyecto.id}}">👁️</a>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </main>
        </div>        
    </body>
</html>
