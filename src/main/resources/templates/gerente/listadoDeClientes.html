<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <title>Listado de Proyectos - DevFlow</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="/css/estilos.css">
        <link rel="stylesheet" href="/css/botones.css">
        <script src="/js/usuario-logueado.js"></script>
        <script src="/js/alertas.js"></script>
    </head>
    <body>
         <!-- Encabezado -->
        <header class="header">
            <h2 class="logo">DevFlow</h2>
            <div class="user-info">
                <div class="user-dropdown">
                    <div class="user-avatar" onclick="toggleDropdown()">
                        <img src="/img/usuario-gerente.png" alt="Avatar" class="avatar-img">
                        <span th:text="${nombreUsuario}">Nombre</span>
                        <span class="arrow">▼</span>
                    </div>
                    <div class="dropdown-menu" id="userMenu">
                        <a href="/gerente">Perfil</a>
                        <a href="/login">Cerrar sesión</a>
                    </div>
                </div>
            </div>
        </header>

      <div class="main-container">
            <!-- Barra lateral -->
            <nav class="sidebar">
                <ul>
                    <li>🟣 <a href="/gerente">Inicio</a></li>
                    <li>🟣 <a href="/gerente/clientes">Clientes</a></li>
                    <li>🟣 <a href="/gerente/proyectos">Proyectos</a></li>
                </ul>
            </nav>
            
            <!-- Contenido principal -->
            <main class="content">
                <h2>Clientes</h2>

                <!-- Filtros de búsqueda -->
                <form action="/gerente/clientes" method="get" class="filter-form">
                    <input type="text" name="filtro" placeholder="Buscar por nombre o email..." th:value="${filtro}">
                    <button type="submit">Buscar</button>
                </form>

                <!-- Tabla de usuarios -->
                <!-- Tabla de usuarios -->
                <div class="user-card">
                    <table class="user-table">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Nombre</th>
                                <th>Email</th>
                                <th>Teléfono</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="usu : ${usuarios}">
                                <td th:text="${usu.id}"></td>
                                <td th:text="${usu.nombre}"></td>
                                <td th:text="${usu.email}"></td>
                                <td th:text="${usu.telefono}"></td>
                                <td class="actions">
                                    <button class="btn btn-ver" th:onclick="'location.href=\'/gerente/clientes/detalles/' + ${usu.id} + '\''">Ver</button>                                    
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </main>
        </div>
    </body>
</html>
