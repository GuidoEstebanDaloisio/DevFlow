<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <title>Detalle del Proyecto</title>
        <style>
            body {
                margin: 0;
                font-family: Arial, sans-serif;
            }
            header {
                display: flex;
                justify-content: space-between;
                align-items: center;
                background-color: #f0f0f0;
                padding: 15px;
                border-bottom: 1px solid #ccc;
            }
            nav {
                width: 200px;
                background-color: #e0e0e0;
                padding: 20px;
                height: 100vh;
            }
            nav ul {
                list-style: none;
                padding: 0;
            }
            nav li {
                margin-bottom: 10px;
            }
            .layout {
                display: flex;
            }
            main {
                flex-grow: 1;
                padding: 20px;
            }
            table {
                text-align: left;
                border-collapse: collapse;
                width: 100%;
                margin-top: 20px;
            }
            th, td {
                border: 1px solid #ccc;
                padding: 10px;
            }
            .input-fecha, .input-fecha-final {
                margin: 20px 0;
            }
        </style>
    </head>
    <body>

        <!-- Header -->
        <header>
            <h2>DevFlow</h2>
            <div>
                <span>Administrador: <span th:text="${nombreUsuario}">Nombre</span></span>
                <button onclick="window.location.href = '/login'" style="margin-left: 20px;">Cerrar sesión</button>
            </div>
        </header>

        <!-- Layout principal -->
        <div class="layout">
            <!-- Sidebar -->
            <nav>
                <ul>
                    <li>🏠 <a href="/admin">Inicio</a></li>
                    <li>📁 <a href="/admin/proyectos">Proyectos</a></li>
                    <li>👥 <a href="/admin/usuarios">Usuarios</a></li>
                    <li>🧠 <a href="/admin/desarrolladores">Desarrolladores</a></li>
                </ul>
            </nav>

            <!-- Contenido principal -->
            <main>
                <h1>Detalles del Usuario</h1>

                <!-- Detalles del proyecto -->
                <div>
                    <p><strong>ID:</strong> <span th:text="${usuario.id}"></span></p>
                    <p><strong>Nombre:</strong> <span th:text="${usuario.nombre}"></span></p>
                    <p><strong>Email:</strong> <span th:text="${usuario.email}"></span></p>
                    <p><strong>Telefono:</strong> <span th:text="${usuario.telefono}"></span></p>
                    <p><strong>Rol:</strong> <span th:text="${usuario.rol}"></span></p>
                </div>

 

                <a href="/admin/usuarios">
                    <button type="button">Volver a Usuarios</button>
                </a>
            </main>
        </div>

    </body>
</html>
