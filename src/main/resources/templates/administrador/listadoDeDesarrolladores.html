<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <title>Asignar Devs - Administrador</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="/css/estilos.css">
        <script src="/js/usuario-logueado.js"></script>
        <script src="/js/alertas.js"></script>
    </head>
    <body>
        <!-- Encabezado -->
        <header class="header">
            <h2 class="logo">DevFlow</h2>
            <div class="user-info">
                <div class="user-dropdown">
                    <div class="user-avatar" onclick="toggleDropdown()">
                        <img src="/img/usuario-administrador.png" alt="Avatar" class="avatar-img">
                        <span th:text="${nombreUsuario}">Nombre</span>
                        <span class="arrow">▼</span>
                    </div>
                    <div class="dropdown-menu" id="userMenu">
                        <a href="/admin">Perfil</a>
                        <a href="/login">Cerrar sesión</a>
                    </div>
                </div>
            </div>
        </header>

        <!-- Contenedor principal -->
        <div class="main-container">
            <!-- Barra lateral -->
            <nav class="sidebar">
                <ul>
                    <li>🏠 <a href="/admin">Inicio</a></li>
                    <li>📁 <a href="/admin/proyectos">Proyectos</a></li>
                    <li>👥 <a href="/admin/usuarios">Usuarios</a></li>
                    <li>🧠 <a href="/admin/desarrolladores">Desarrolladores</a></li>
                </ul>
            </nav>

            <!-- Contenido principal -->
            <main class="content">
                <h2>Desarrolladores</h2>

                <!-- Filtros de búsqueda -->
                <form action="/admin/desarrolladores" method="get" class="filter-form">
                    <input type="text" name="filtro" placeholder="Buscar por nombre o habilidad..." th:value="${filtro}">
                    <select name="estado">
                        <option value="">Todos los estados</option>
                        <option th:value="'DISPONIBLE'" th:selected="${estadoSeleccionado == 'DISPONIBLE'}">Disponible</option>
                        <option th:value="'ASIGNADO'" th:selected="${estadoSeleccionado == 'ASIGNADO'}">Asignado</option>
                    </select>
                    <button type="submit">Buscar</button>
                </form>

                <!-- Tabla de desarrolladores -->
                <div class="user-card">
                    <table class="user-table">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Nombre</th>
                                <th>Habilidades</th>
                                <th>Disponibilidad</th>
                                <th>Proyecto asignado</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="dev : ${desarrolladores}">
                                <td th:text="${dev.id}"></td>
                                <td th:text="${dev.nombre}"></td>
                                <td th:text="${dev.habilidades}"></td>
                                <td th:text="${dev.estaDisponible} ? 'Disponible' : 'Asignado'"></td>
                                <td th:text="${dev.proyecto != null ? dev.proyecto.getTitulo : 'Sin proyecto'}"></td>
                                <td class="actions">
                                    <a th:href="@{'/admin/desarrolladores/editar/' + ${dev.id}}">✏️</a>
                                    <a th:href="@{'/admin/desarrolladores/eliminar/' + ${dev.id}}">🗑️</a>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>

                <!-- Botón para crear nuevo desarrollador -->
                <div class="new-element-btn">
                    <button onclick="window.location.href = '/admin/desarrolladores/nuevo'">+ Crear nuevo desarrollador</button>
                </div>
            </main>
        </div>
    </body>
</html>
