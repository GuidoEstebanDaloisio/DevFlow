<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <title>Proyectos - Administrador</title>
    </head>
    <body>
        <!-- Encabezado -->
        <div style="display: flex; justify-content: space-between; align-items: center; padding: 15px; background-color: #f0f0f0; border-bottom: 1px solid #ccc;">
            <h2>DevFlow</h2>
            <div>
                <span>Administrador: <span th:text="${nombreUsuario}">Nombre</span></span>
                <button onclick="window.location.href = '/login'" style="margin-left: 20px;">Cerrar sesión</button>
            </div>
        </div>

        <!-- Menú lateral + contenido -->
        <div style="display: flex;">            

            <!-- Barra lateral -->
            <nav style="width: 200px; background-color: #e0e0e0; padding: 20px;">
                <ul style="list-style-type: none; padding: 0;">
                    <li>🏠 <a href="/admin">Inicio</a></li>
                    <li>📁 <a href="/admin/proyectos">Proyectos</a></li>
                    <li>👥 <a href="/admin/usuarios">Usuarios</a></li>
                    <li>🧠 <a href="/admin/desarrolladores">Desarrolladores</a></li>
                </ul>
            </nav>

            <!-- Contenido principal -->
            <div style="flex: 1; padding: 20px;">
                <h2>📁 Proyectos</h2>

                <!-- Filtros de búsqueda -->
                <form action="/admin/proyectos" method="get" style="margin-bottom: 20px;">
                    <input type="text" name="filtro" placeholder="Buscar por título..." th:value="${filtro}">
                    <select name="estado">
                        <option value="">Todos los estados</option>
                        <option th:value="'ESPERANDO_REVISION'" th:selected="${estadoSeleccionado == 'ESPERANDO_REVISION'}">Esperando revisión</option>
                        <option th:value="'APROBADO'" th:selected="${estadoSeleccionado == 'APROBADO'}">Aprobado</option>
                        <option th:value="'RECHAZADO'" th:selected="${estadoSeleccionado == 'RECHAZADO'}">Rechazado</option>
                        <option th:value="'EN_PROGRESO'" th:selected="${estadoSeleccionado == 'EN_PROGRESO'}">En progreso</option>
                        <option th:value="'COMPLETADO'" th:selected="${estadoSeleccionado == 'COMPLETADO'}">Completado</option>
                        <option th:value="'CANCELADO'" th:selected="${estadoSeleccionado == 'CANCELADO'}">Cancelado</option>
                        <option th:value="'EN_PAUSA'" th:selected="${estadoSeleccionado == 'EN_PAUSA'}">En pausa</option>
                    </select>
                    <button type="submit">Buscar</button>
                </form>


                <table border="1" cellpadding="10" cellspacing="0" style="width: 100%; text-align: left;">
                    <thead style="background-color: #f0f0f0;">
                        <tr>
                            <th>ID</th>
                            <th>Título</th>
                            <th>Estado de avance</th>
                            <th>Fecha de inicio</th>
                            <th>Fecha de finalización</th>
                            <th>Presupuesto</th>
                            <th>Medio de encargo</th>
                            <th>Acción</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="proyecto : ${proyectos}">
                            <td th:text="${proyecto.id}"></td>
                            <td th:text="${proyecto.titulo}"></td>
                            <td th:text="${proyecto.estadoAvance}"></td>
                            <td th:text="${proyecto.fechaInicio != null ? #dates.format(proyecto.fechaInicio, 'dd/MM/yyyy') : '--'}"></td>
                            <td th:text="${proyecto.fechaFinalizacion != null ? #dates.format(proyecto.fechaFinalizacion, 'dd/MM/yyyy') : '--'}"></td>
                            <td th:text="${'$ %.2f'.formatted(proyecto.presupuesto)}"></td>
                            <td th:text="${proyecto.medioEncargo}"></td>
                            <td>
                                <a th:href="@{'/admin/proyectos/detalles/' + ${proyecto.id}}">👁️</a>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
        <script src="/js/alertas.js"></script>
    </body>
</html>
