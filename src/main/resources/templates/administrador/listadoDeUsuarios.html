<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <title>Usuarios - Administrador</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="/css/estilos.css">
        <script src="/js/usuario-logueado.js"></script>
        <script src="/js/alertas.js"></script>
    </head>
    <body>
        <!-- Encabezado -->
        <header class="header">
            <h2 class="logo">DevFlow</h2>
            <div class="user-info">
                <div class="user-dropdown">
                    <div class="user-avatar" onclick="toggleDropdown()">
                        <img src="/img/usuario-administrador.png" alt="Avatar" class="avatar-img">
                        <span th:text="${nombreUsuario}">Nombre</span>
                        <span class="arrow">▼</span>
                    </div>
                    <div class="dropdown-menu" id="userMenu">
                        <a href="/admin">Perfil</a>
                        <a href="/login">Cerrar sesión</a>
                    </div>
                </div>
            </div>
        </header>

        <!-- Contenedor principal -->
        <div class="main-container">
            <!-- Barra lateral -->
            <nav class="sidebar">
                <ul>
                    <li>🏠 <a href="/admin">Inicio</a></li>
                    <li>📁 <a href="/admin/proyectos">Proyectos</a></li>
                    <li>👥 <a href="/admin/usuarios">Usuarios</a></li>
                    <li>🧠 <a href="/admin/desarrolladores">Desarrolladores</a></li>
                </ul>
            </nav>

            <!-- Contenido principal -->
            <main class="content">
                <h2>Usuarios</h2>

                <!-- Filtros de búsqueda -->
                <form action="/admin/usuarios" method="get" class="filter-form">
                    <input type="text" name="filtro" placeholder="Buscar por nombre o email..." th:value="${filtro}">

                    <select name="rol">
                        <option value="">Todos los roles</option>
                        <option th:value="'ADMINISTRADOR'" th:selected="${rolSeleccionado == 'ADMINISTRADOR'}">Administrador</option>
                        <option th:value="'GERENTE'" th:selected="${rolSeleccionado == 'GERENTE'}">Gerente</option>
                        <option th:value="'CLIENTE'" th:selected="${rolSeleccionado == 'CLIENTE'}">Cliente</option>
                    </select>

                    <button type="submit">Buscar</button>
                </form>

                <!-- Tabla de usuarios -->
                <div class="user-card">
                    <table class="user-table">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Nombre</th>
                                <th>Email</th>
                                <th>Teléfono</th>
                                <th>Rol</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="usu : ${usuarios}">
                                <td th:text="${usu.id}"></td>
                                <td th:text="${usu.nombre}"></td>
                                <td th:text="${usu.email}"></td>
                                <td th:text="${usu.telefono}"></td>
                                <td th:text="${usu.rol}"></td>
                                <td class="actions">
                                    <a th:href="@{'/admin/usuarios/detalles/' + ${usu.id}}">👁</a>
                                    <a th:href="@{'/admin/usuarios/editar/' + ${usu.id}}">✏️</a>
                                    <a th:href="@{'/admin/usuarios/eliminar/' + ${usu.id}}">🗑</a>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>

                <!-- Botón para crear nuevo usuario -->
                <div class="new-element-btn" style="margin-top: 20px;">
                    <a href="/admin/usuarios/nuevo">
                        <button>+ Crear nuevo usuario</button>
                    </a>
                </div>
            </main>
        </div>
    </body>
</html>
