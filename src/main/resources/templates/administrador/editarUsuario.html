<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <title>Editar Usuario</title>
    </head>
    <body>
        <h2>✏️ Editar Usuario</h2>

        <!-- Mostrar errores si los hay -->
        <div th:if="${error}" style="color: red;">
            <p th:text="${error}"></p>
        </div>

        <form th:action="@{'/admin/usuarios/editar/' + ${usuario.id}}" th:object="${usuario}" method="post">
            <label for="nombre">Nombre:</label>
            <input type="text" id="nombre" th:field="*{nombre}" required><br><br>

            <label for="contrasenia">Nueva Contraseña (dejar vacío para mantener la actual):</label>
            <input type="password" id="contrasenia" th:field="*{contrasenia}" /><br><br>

            <label for="email">Email:</label>
            <input type="email" id="email" th:field="*{email}" required><br><br>

            <label for="telefono">Teléfono:</label>
            <input type="text" id="telefono" th:field="*{telefono}"><br><br>

            <label for="rol">Rol:</label>
            <select id="rol" th:field="*{rol}">
                <option value="ADMINISTRADOR">Administrador</option>
                <option value="GERENTE">Gerente</option>
                <option value="CLIENTE">Cliente</option>
            </select><br><br>

            <button type="submit">Guardar cambios</button>
            <a href="/admin/usuarios"><button type="button">Cancelar</button></a>
        </form>
    </body>
</html>
